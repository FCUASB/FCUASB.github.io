name: Validate cloud acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tools/acceptance-build --ignore-scripts
      - run: npm run check --prefix tools/acceptance-build
      - run: npm test --prefix tools/acceptance-build
      - run: npm run check:catalog --prefix tools/acceptance-build
